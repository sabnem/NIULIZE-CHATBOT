<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Add this line after your meta charset -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <title>Chatbot Widget</title>
  <style>
    #chatbot-button {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
    color: white;
    border: none;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    font-size: 24px;
    cursor: pointer;
    z-index: 1000;
    box-shadow: 0 4px 12px rgba(0,123,255,0.3);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    }
    
    #chatbot-button:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 16px rgba(0,123,255,0.4);
    }

    #chatbot-window {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 340px;
      height: 470px;
      background-color: #fff;
      border-radius: 16px;
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      overflow: hidden;
      border: 1px solid #e3e3e3;
      animation: fadeInUp 0.3s;
      flex-direction: column;
      display: none; /* Only one display property needed */
    }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px);}
      to { opacity: 1; transform: translateY(0);}
    }
    
    #chatbot-header {
      background: linear-gradient(90deg, #007bff 60%, #0056b3 100%);
      color: #fff;
      padding: 16px;
      font-size: 1.2em;
      font-weight: bold;
      text-align: center;
      letter-spacing: 1px;
      border-bottom: 1px solid #e3e3e3;
    }
    
    #chatbot-messages {
      flex: 1;
      padding: 16px 12px;
      overflow-y: auto;
      background: #f7f8fa;
      font-size: 1em;
    }
    
    .chat-message {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }
    .chat-message.user {
      align-self: flex-end;
      background: #e6f0ff;
      color: #007bff;
      border-radius: 12px 12px 0 12px;
      padding: 8px 14px;
      box-shadow: 0 2px 6px rgba(0,123,255,0.08);
    }
    .chat-message.bot {
      align-self: flex-start;
      background: #f1f1f1;
      color: #333;
      border-radius: 12px 12px 12px 0;
      padding: 8px 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    
    #chatbot-input {
      display: flex;
      border-top: 1px solid #e3e3e3;
      background: #fff;
      padding: 10px;
    }
    
    #chat-input {
      flex: 1;
      border: 1px solid #e3e3e3;
      border-radius: 8px;
      padding: 10px;
      outline: none;
      font-size: 1em;
      margin-right: 8px;
      transition: border-color 0.2s;
    }
    #chat-input:focus {
      border-color: #007bff;
    }
    
    #send-btn {
      padding: 0 18px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.2s;
    }
    #send-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <!-- Chat Button -->
  <button id="chatbot-button"><i class="fas fa-comments"></i></button>

  <!-- Chat Window -->
  <div id="chatbot-window">
    <div id="chatbot-messages"></div>
    <div id="chatbot-input">
      <input type="text" id="chat-input" placeholder="Type a message...">
      <button id="send-btn">Send</button>
    </div>
  </div>

 <script>
    const chatButton = document.getElementById('chatbot-button');
    const chatWindow = document.getElementById('chatbot-window');
    const sendBtn = document.getElementById('send-btn');
    const input = document.getElementById('chat-input');
    const messages = document.getElementById('chatbot-messages');

    // Add click handler for document to close chat when clicking outside
    document.addEventListener('click', (e) => {
        if (!chatWindow.contains(e.target) && e.target !== chatButton) {
            chatWindow.style.display = 'none';
        }
    });

    // Modified chat button click handler
    chatButton.addEventListener('click', (e) => {
        e.stopPropagation(); // Prevent event from bubbling to document
        chatWindow.style.display = (chatWindow.style.display === 'none' || chatWindow.style.display === '') ? 'flex' : 'none';
    });

    // Prevent clicks inside chat window from closing it
    chatWindow.addEventListener('click', (e) => {
        e.stopPropagation();
    });

    // ...existing message handling code...
    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendMessage();
    });

    function appendMessage(text, sender) {
        const div = document.createElement('div');
        div.textContent = (sender === 'user' ? 'You: ' : 'Bot: ') + text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        appendMessage(text, 'user');
        input.value = '';

        fetch('/chatbot/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ message: text })
        })
        .then(response => response.json())
        .then(data => {
            appendMessage(data.response, 'bot');
        });
    }
</script>
</body>
</html>
