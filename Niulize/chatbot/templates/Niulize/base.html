<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Add this line after your meta charset -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <title>Chatbot Widget</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #chatbot-button {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        font-size: 24px;
        cursor: pointer;
        z-index: 1000;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    #chatbot-button:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
    }

    #chatbot-window {
        position: fixed;
        bottom: 90px;
        right: 20px;
        width: 400px;
        height: 600px;
        background-color: #fff;
        border-radius: 20px;
        z-index: 1000;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        overflow: hidden;
        border: none;
        animation: fadeInUp 0.3s;
        flex-direction: column;
        display: none;
    }
    
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    #chatbot-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        text-align: center;
        border-bottom: none;
    }

    #chatbot-header h1 {
        font-size: 24px;
        margin-bottom: 5px;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #chatbot-header p {
        font-size: 14px;
        opacity: 0.9;
        margin: 0;
    }
    
    #chatbot-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        background: #f8f9fa;
        font-size: 14px;
        line-height: 1.4;
    }
    
    .chat-message {
        margin-bottom: 15px;
        display: flex;
        align-items: flex-start;
    }

    .chat-message.user {
        justify-content: flex-end;
    }

    .message-content {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 14px;
        line-height: 1.4;
        white-space: pre-line;
    }

    .chat-message.bot .message-content {
        background: #e9ecef;
        color: #333;
        border-radius: 18px 18px 18px 4px;
    }

    .chat-message.user .message-content {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 18px 18px 4px 18px;
    }

    .typing-indicator {
        display: none;
        align-items: center;
        margin-bottom: 15px;
    }

    .typing-dots {
        display: flex;
        gap: 4px;
        margin-left: 10px;
    }

    .typing-dots span {
        width: 8px;
        height: 8px;
        background: #667eea;
        border-radius: 50%;
        animation: typing 1.4s infinite;
    }

    .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes typing {
        0%, 60%, 100% {
            transform: translateY(0);
        }
        30% {
            transform: translateY(-10px);
        }
    }
    
    #chatbot-input {
        padding: 20px;
        background: white;
        border-top: 1px solid #e9ecef;
        display: flex;
        gap: 10px;
    }
    
    #chat-input {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid #e9ecef;
        border-radius: 25px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.3s;
    }

    #chat-input:focus {
        border-color: #667eea;
    }
    
    #send-btn {
        padding: 12px 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-size: 14px;
        transition: transform 0.2s;
    }

    #send-btn:hover {
        transform: translateY(-2px);
    }

    #send-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    /* Responsive design */
    @media (max-width: 480px) {
        #chatbot-window {
            width: 90vw;
            height: 80vh;
            right: 5vw;
            bottom: 80px;
        }
        
        #chatbot-button {
            bottom: 15px;
            right: 15px;
            width: 50px;
            height: 50px;
            font-size: 20px;
        }
    }
  </style>
</head>
<body>
  {% csrf_token %}
  <!-- Chat Button -->
  <button id="chatbot-button"><i class="fa-regular fa-comment-dots"></i></button>

  <!-- Chat Window -->
  <div id="chatbot-window">
    <div id="chatbot-header">
        <h1>Niulize Mimi</h1>
        <p>Ask me anything about our services!</p>
    </div>
    <div id="chatbot-messages">
        <!-- Welcome message -->
        <div class="chat-message bot">
            <div class="message-content">
                Hello! Welcome to Niulize. I'm here to help you with information about our services, pricing, contact details, and more. What would you like to know?
            </div>
        </div>
    </div>
    
    <!-- Typing indicator -->
    <div class="typing-indicator" id="typingIndicator">
        <div class="chat-message bot">
            <div class="message-content">
                Typing<div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </div>
    
    <div id="chatbot-input">
        <input type="text" id="chat-input" placeholder="Type your question here...">
        <button id="send-btn">Send</button>
    </div>
  </div>

<script>
    const chatButton = document.getElementById('chatbot-button');
    const chatWindow = document.getElementById('chatbot-window');
    const sendBtn = document.getElementById('send-btn');
    const input = document.getElementById('chat-input');
    const messages = document.getElementById('chatbot-messages');
    const typingIndicator = document.getElementById('typingIndicator');

    // Add click handler for document to close chat when clicking outside
    document.addEventListener('click', (e) => {
        if (!chatWindow.contains(e.target) && e.target !== chatButton) {
            chatWindow.style.display = 'none';
        }
    });

    // Modified chat button click handler
    chatButton.addEventListener('click', (e) => {
        e.stopPropagation(); // Prevent event from bubbling to document
        chatWindow.style.display = (chatWindow.style.display === 'none' || chatWindow.style.display === '') ? 'flex' : 'none';
        if (chatWindow.style.display === 'flex') {
            input.focus();
        }
    });

    // Prevent clicks inside chat window from closing it
    chatWindow.addEventListener('click', (e) => {
        e.stopPropagation();
    });

    // Message handling
    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    function appendMessage(text, sender) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `chat-message ${sender}`;
        
        const messageContent = document.createElement('div');
        messageContent.className = 'message-content';
        messageContent.textContent = text;
        
        messageDiv.appendChild(messageContent);
        messages.appendChild(messageDiv);
        
        // Scroll to bottom
        messages.scrollTop = messages.scrollHeight;
    }

    function showTypingIndicator() {
        typingIndicator.style.display = 'flex';
        messages.scrollTop = messages.scrollHeight;
    }

    function hideTypingIndicator() {
        typingIndicator.style.display = 'none';
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        // Disable input and button
        input.disabled = true;
        sendBtn.disabled = true;

        // Add user message
        appendMessage(text, 'user');
        input.value = '';

        // Show typing indicator
        showTypingIndicator();

        try {
            // Get CSRF token
            const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;
        
            // Send request to Django backend
            const response = await fetch('/chatbot/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();
            
            // Hide typing indicator
            hideTypingIndicator();
            
            // Add bot response
            appendMessage(data.response, 'bot');

        } catch (error) {
            console.error('Error:', error);
            hideTypingIndicator();
            appendMessage('Sorry, I encountered an error. Please try again.', 'bot');
        } finally {
            // Re-enable input and button
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }
</script>
</body>
</html>
